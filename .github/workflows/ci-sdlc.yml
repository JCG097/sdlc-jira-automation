name: SDLC CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Automated Tests
        run: |
          echo "Ejecutando suite de pruebas automatizadas..."
          exit 0

      - name: Extract Jira Issue Key
        id: jira_key
        run: |
          ISSUE_KEY=$(echo "${{ github.event.head_commit.message }}" | grep -oE '[A-Z]+-[0-9]+' | head -n 1)
          if [ -z "$ISSUE_KEY" ]; then
            echo "No se detectó ID de Jira en el commit. Usando ticket por defecto: SDLC-4"
            ISSUE_KEY="SDLC-4"
          fi
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          echo "Ticket detectado: $ISSUE_KEY"

      - name: Transition Jira Issue to Ready for QA
        env:
          JIRA_BASE: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.jira_key.outputs.issue_key }}
        run: |
          # Limpiar posibles espacios o barra final de la URL
          CLEAN_URL=$(echo "${JIRA_BASE}" | sed -e 's/[[:space:]]*$//' -e 's|/*$||')
          echo "Consultando Jira en: ${CLEAN_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions"
          
          # Consultar transiciones disponibles
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -u "${JIRA_USER}:${JIRA_TOKEN}" \
            -X GET \
            -H "Accept: application/json" \
            "${CLEAN_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions")

          BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1 | sed -e 's/HTTP_STATUS://')

          echo "Respuesta HTTP: $STATUS"

          if [ "$STATUS" -ne 200 ]; then
            echo "Error al conectar con Jira API:"
            echo "$BODY"
            exit 1
          fi

          # Buscar el ID de la transición hacia Ready for QA
          TRANSITION_ID=$(echo "$BODY" | jq -r '.transitions[] | select(.to.name | test("ready for qa|qa"; "i")) | .id' | head -n 1)

          if [ -z "$TRANSITION_ID" ] || [ "$TRANSITION_ID" = "null" ]; then
            echo "Aviso: No se encontro una transicion directa hacia Ready for QA. Transiciones disponibles actualmente:"
            echo "$BODY" | jq '.transitions[] | {id: .id, name: .name, to: .to.name}'
          else
            echo "Ejecutando transicion ID $TRANSITION_ID para $ISSUE_KEY..."
            curl -s -X POST \
              -u "${JIRA_USER}:${JIRA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"transition\": {\"id\": \"$TRANSITION_ID\"}}" \
              "${CLEAN_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions"
            echo "Transicion procesada."
          fi

      - name: Notify Discord / ChatOps
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ISSUE_KEY: ${{ steps.jira_key.outputs.issue_key }}
          JIRA_BASE: ${{ secrets.JIRA_BASE_URL }}
        run: |
          CLEAN_URL=$(echo "${JIRA_BASE}" | sed -e 's/[[:space:]]*$//' -e 's|/*$||')
          if [ -n "$DISCORD_WEBHOOK" ]; then
            PAYLOAD=$(cat <<EOF
          {
            "content": "🚀 **El ticket [${ISSUE_KEY}](${CLEAN_URL}/browse/${ISSUE_KEY}) ha sido procesado por el pipeline de CI/CD y está listo para pruebas.**"
          }
          EOF
            )
            curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
            echo "Notificacion enviada a Discord."
          fi
